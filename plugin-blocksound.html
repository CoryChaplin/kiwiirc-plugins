<template id="block-sound">
  <div class="kiwi-statebrowser-btnblocksound">
      <button
          type="button"
          :aria-pressed="blockSOUND ? 'true' : 'false'"
          aria-label="Couper les notifications sonores"
          :title="blockSOUND ? 'Activer les notifications sonores' : 'Désactiver les notifications sonores'"
          @click="buttonClicked"
      >
          <i v-if="blockSOUND" class="fa fa-bell-slash kiwi-statebrowser-btnRedBS" aria-hidden="true"></i>
          <i v-else class="fa fa-bell" aria-hidden="true"></i>
      </button>
  </div>
</template>

<script>
kiwi.plugin('block_sound', function(kiwi, log) {
    var button = new kiwi.Vue({
        template: '#block-sound',
        computed: {
          	blockSOUND: function blockSOUND() {
          		return kiwi.state.setting('buffers.mute_sound');

          	}
        },
        methods: {
            buttonClicked: function buttonClicked() {
                var msg = 'Vous venez ' + (this.blockSOUND ? 'd\'activer' : 'de désactiver') + ' les notifications sonores.';
                var network = this.$state.getActiveNetwork();
                kiwi.state.setting('buffers.mute_sound', !this.blockSOUND);
                kiwi.state.addMessage(kiwi.state.getActiveBuffer(), { nick: 'Message automatique', message: msg, type: 'notice' });
                if (kiwi.state.ui.is_narrow) {
                    kiwi.state.$emit('statebrowser.hide');
                }
            }
        },
    });
    kiwi.addUi('browser_foot', button.$mount().$el);
});
</script>

<style>
/* Flows in the rail foot row; the theme paints it. */
.kiwi-statebrowser-btnblocksound button {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font-size: 18px;
    cursor: pointer;
}

.kiwi-statebrowser-btnRedBS {
    color: #F1948A;
}
</style>
