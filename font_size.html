<template id="font-size">
    <div class="kiwi-format-buttons">
        <button type="button" class="kiwi-decrease-font" title="Réduire le texte" aria-label="Réduire le texte"
             @click="decreaseFont"
        >
            A<sup>-</sup>
        </button>
        <button type="button" class="kiwi-increase-font" title="Agrandir le texte" aria-label="Agrandir le texte"
             @click="increaseFont"
        >
            A<sup>+</sup>
        </button>
    </div>
</template>
<script>
    kiwi.plugin('font-size', function(kiwi, log) {

        let fontSize = new kiwi.Vue({
            template: '#font-size',
            data() {
                return {
                    // Global zoom factor; 1 = the theme's validated baseline.
                    scale: 1.0,
                };
            },
            methods: {
                increaseFont: function increaseFont() {
                    if(this.scale < 1.5) {
                        this.scale = Math.round((this.scale + 0.1) * 10) / 10;
                    }
                    this.applyScale()
                },
                decreaseFont: function decreaseFont() {
                    if(this.scale > 0.8) {
                        this.scale = Math.round((this.scale - 0.1) * 10) / 10;
                    }
                    this.applyScale()
                },
                applyScale: function applyScale() {
                    // Drive the theme's --ui-scale so rem (fil) and native px text zoom together.
                    document.documentElement.style.setProperty('--ui-scale', this.scale);
                },
            },
        });
        kiwi.addUi('browser_foot', fontSize.$mount().$el);
    });
</script>

<style>
/* Two controls, flowing in the rail foot row; the theme paints them. */
.kiwi-format-buttons {
    display: flex;
}

.kiwi-decrease-font,
.kiwi-increase-font {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font-size: 1.1em;
    cursor: pointer;
}
</style>
