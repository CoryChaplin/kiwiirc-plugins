<template id="block-pv">
  <div class="kiwi-statebrowser-btnblockmp">
      <button
          type="button"
          :aria-pressed="blockPM ? 'true' : 'false'"
          aria-label="Bloquer les messages privés"
          :title="blockPM ? 'Débloquer les PVS' : 'Bloquer les PVS'"
          @click="buttonClicked"
      >
          <i v-if="blockPM" class="fa fa-lock kiwi-statebrowser-btnRedBMP" aria-hidden="true"></i>
          <i v-else class="fa fa-unlock-alt" aria-hidden="true"></i>
      </button>
  </div>
</template>

<script>
kiwi.plugin('block_pv', function(kiwi, log) {
    var button = new kiwi.Vue({
        template: '#block-pv',
        computed: {
          	blockPM: function blockPM() {
          		return kiwi.state.setting('buffers.block_pms');

          	}
        },
        methods: {
            buttonClicked: function buttonClicked() {
                var msg = 'Vous venez de ' + (this.blockPM ? 'débloquer' : 'bloquer') + ' vos messages privés.';
                var network = this.$state.getActiveNetwork();
                kiwi.state.setting('buffers.block_pms', !this.blockPM);
                kiwi.state.addMessage(kiwi.state.getActiveBuffer(), { nick: 'Message automatique', message: msg, type: 'notice' });
                if (kiwi.state.ui.is_narrow) {
                    kiwi.state.$emit('statebrowser.hide');
                }
            }
        },
    });
    kiwi.addUi('browser_foot', button.$mount().$el);
});
</script>

<style>
/* Flows in the rail foot row; the theme paints it. */
.kiwi-statebrowser-btnblockmp button {
    width: 44px;
    height: 44px;
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font-size: 18px;
    cursor: pointer;
}

.kiwi-statebrowser-btnRedBMP {
    color: #F1948A;
}
</style>
